name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pebbenote/package-lock.json

      # The eslint hook runs from pebbenote/node_modules
      - run: npm ci --prefix pebbenote

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - run: pipx install poetry
      - run: poetry config virtualenvs.in-project true

      - uses: actions/cache@v4
        with:
          path: be/.venv
          key: venv-${{ runner.os }}-py3.15-${{ hashFiles('be/poetry.lock') }}

      - run: poetry install --no-root
      - run: poetry run bash run_tests.sh

  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pipx install poetry
      - run: poetry config virtualenvs.in-project true

      - uses: actions/cache@v4
        with:
          path: cli/.venv
          key: cli-venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('cli/poetry.lock') }}

      - run: poetry install --no-root
      - run: poetry run python -m unittest discover -v
