[tool.poetry]
name = "pebbenote-cli"
version = "0.1.0"
description = "Command line client for pebbenote"
authors = ["Grzegorz Koperwas <admin@grzegorzkoperwas.site>"]
license = "GPL"
readme = "README.md"
packages = [{ include = "pebbenote_cli" }]

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.3"

[tool.poetry.scripts]
pebbenote = "pebbenote_cli.cli:main"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
