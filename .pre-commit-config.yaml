repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(be|cli)/
      - id: ruff-format
        files: ^(be|cli)/
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        files: ^pebbenote/src/c/.*\.(c|h)$
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: npm --prefix pebbenote exec -- eslint --config pebbenote/eslint.config.mjs --fix
        files: ^pebbenote/(src/ts|scripts)/.*\.(ts|mjs)$
        exclude: ^pebbenote/src/ts/(api/|env\.ts)
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.6.2"]
        entry: prettier --write --ignore-unknown
        files: ^pebbenote/src/ts/.*\.(ts|js|json)$
        exclude: ^pebbenote/src/ts-build/
