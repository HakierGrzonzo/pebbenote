repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^be/
      - id: ruff-format
        files: ^be/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.6.2"]
        entry: prettier --write --ignore-unknown
        files: ^pebbenote/src/ts/.*\.(ts|js|json)$
        exclude: ^pebbenote/src/ts-build/
