services:
  db:
    image: postgres:17
    volumes:
      - app_data:/var/lib/postgresql/data
      # Only runs when the data volume is first created
      - ./keycloak/init-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGUSER: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "postgres" ]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/pebbenote-realm.json:/opt/keycloak/data/import/pebbenote-realm.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # OpenTelemetry collector with Tempo, Loki, Prometheus and Grafana (:3000)
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data

  be:
    build:
      context: ./be
    develop:
      watch:
        - action: sync
          path: ./be/
          target: /app
          initial_sync: true
        - action: rebuild
          path: ./be/pyproject.toml
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: localhost
      POSTGRES_APP_USER: pebbenote_app
      POSTGRES_APP_PASSWORD: pebbenote_app
      OLLAMA_HOST: "localhost"
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:e4b}
      DECISION_MODEL: ${DECISION_MODEL:-nimble}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0}
      OIDC_ISSUER: "http://localhost:8080/realms/pebbenote"
      OIDC_AUDIENCE: "pebbenote-be"
      REDIS_URL: "redis://localhost:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
      OTEL_SERVICE_NAME: pebbenote-be
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    entrypoint: poetry run uvicorn pebbenote:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./be
    develop:
      watch:
        - action: sync
          path: ./be/
          target: /app
          initial_sync: true
        - action: rebuild
          path: ./be/pyproject.toml
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: localhost
      POSTGRES_APP_USER: pebbenote_app
      POSTGRES_APP_PASSWORD: pebbenote_app
      OLLAMA_HOST: "localhost"
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:e4b}
      DECISION_MODEL: ${DECISION_MODEL:-nimble}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0}
      OIDC_ISSUER: "http://localhost:8080/realms/pebbenote"
      OIDC_AUDIENCE: "pebbenote-be"
      REDIS_URL: "redis://localhost:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
      OTEL_SERVICE_NAME: pebbenote-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    entrypoint: poetry run taskiq worker pebbenote.worker:broker pebbenote.actions.tasks --reload

volumes:
  app_data:
    driver: local
  lgtm_data:
    driver: local
