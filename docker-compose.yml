services:
  db:
    image: postgres:17
    volumes:
      - app_data:/var/lib/postgresql/data
      # Only runs when the data volume is first created
      - ./keycloak/init-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGUSER: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "postgres" ]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/pebbenote-realm.json:/opt/keycloak/data/import/pebbenote-realm.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  be:
    build:
      context: ./be
    develop:
      watch:
        - action: sync
          path: ./be/
          target: /app
          initial_sync: true
        - action: rebuild
          path: ./be/pyproject.toml
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: localhost
      OLLAMA_HOST: "localhost"
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:e2b}
      DECISION_MODEL: ${DECISION_MODEL:-nimble}
      OIDC_ISSUER: "http://localhost:8080/realms/pebbenote"
      OIDC_AUDIENCE: "pebbenote-be"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    entrypoint: poetry run uvicorn pebbenote:app --host 0.0.0.0 --port 8000 --reload


volumes:
  app_data:
    driver: local
